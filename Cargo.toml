[package]
name = "css-api"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = { version = "1.0", default-features = false, features = ["apigw_http"] }
lambda_runtime = "1.0"
lightningcss = { version = "1.0.0-alpha.68", features = [ "browserslist", "serde" ] }
serde = "1.0.219"
serde_json = "1.0.145"
tokio = { version = "1.45", features = ["macros"] }
tracing = { version = "0.1.43", features = ["log"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }

